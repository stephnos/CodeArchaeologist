[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "retro-git"
version = "0.1.0"
description = "Generate realistic Git commit history from a finished codebase"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "gitpython>=3.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
groq = ["groq>=0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
retro-git = "retro_git.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["retro_git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
